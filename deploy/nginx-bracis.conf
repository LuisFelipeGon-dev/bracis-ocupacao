# Configuração do Nginx para o site do BRACIS.
# Instalação: sudo cp deploy/nginx-bracis.conf /etc/nginx/sites-available/bracis
#
# Como o acesso chega:
#   navegador -> bracis.ic.ufmt.br (proxy do IC)
#             -> HTTPS na porta 443 deste servidor -> este Nginx -> site na porta 8000.
# O certificado do domínio vem da equipe de TI do IC e fica em /etc/ssl/bracis/.

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name bracis.ic.ufmt.br;

    ssl_certificate     /etc/ssl/bracis/certificado.pem;  # certificado (+ cadeia intermediária)
    ssl_certificate_key /etc/ssl/bracis/chave.key;         # chave privada

    # O site fica em /live (combinado com o IC). Quem abrir só o domínio vai para lá.
    location = / {
        return 302 /live/;
    }

    # HTML, CSS, JS e a logo: o Nginx entrega direto do disco, sem passar pelo Python.
    location /live/static/ {
        alias /opt/bracis/static/;
        expires 10m;
    }

    # Todo o resto de /live vai para o site (uvicorn), que está na porta 8000 desta mesma máquina.
    # Sem nada depois do endereço no proxy_pass: o caminho chega inteiro (com o /live) ao site.
    location /live {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        # Mantém o IP real do visitante que o proxy do IC informa e acrescenta o do proxy.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
