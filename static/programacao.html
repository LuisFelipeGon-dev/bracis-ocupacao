<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <base href="/live/"> <!-- o site fica em /live: endereços sem "/" no começo são relativos a ele -->
  <link rel="icon" href="static/favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="apple-touch-icon" href="static/apple-touch-icon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#F5F3EE">
  <title data-t="titulo_programacao">Programação — BRACIS 2026</title>
  <!-- ?v=4: muda a cada atualização, para o celular não misturar arquivo novo com antigo guardado -->
  <link rel="preload" href="static/fontes/bricolage-grotesque.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="static/tokens.css?v=4">
  <link rel="stylesheet" href="static/publico.css?v=4">
</head>
<body class="pagina-programacao">
  <header class="topo">
    <div class="largura">
      <a href="./" class="topo-logo"><img src="static/logo-bracis.webp" alt="BRACIS 2026" width="419" height="213"></a>
      <div class="topo-direita">
        <span id="selo-ao-vivo" class="selo-ao-vivo">
          <span class="ponto" aria-hidden="true"></span>
          <span><span class="selo-rotulo"><span data-t="ao_vivo">AO VIVO</span> · </span><span id="selo-hora">--:--</span></span>
        </span>
        <span id="aviso-conexao" class="so-leitor" role="status"></span>
        <a id="botao-idioma" class="botao-idioma" href="?lang=en" lang="en">EN</a>
      </div>
    </div>
  </header>

  <main class="largura">
    <h1 class="so-leitor" data-t="aba_programacao">Programação</h1>

    <!-- Seletor Agora | Programação -->
    <nav class="seletor" aria-label="Seções" data-t-aria="secoes">
      <a href="./" data-t="aba_agora">Agora</a>
      <a href="programacao" aria-current="page" data-t="aba_programacao">Programação</a>
    </nav>

    <!-- Dias do evento (vêm da planilha): o programacao.js cria os botões -->
    <fieldset id="dias" class="dias">
      <legend class="so-leitor" data-t="dia_legenda">Dia</legend>
      <div id="botoes-dias" class="dias-botoes"></div>
    </fieldset>

    <fieldset class="filtros">
      <legend class="so-leitor" data-t="filtrar_por_tipo">Filtrar por tipo</legend>
      <button type="button" class="chip" data-tipo="" aria-pressed="true" data-t="filtro_todos">Todos</button>
      <button type="button" class="chip" data-tipo="auditorio" aria-pressed="false" data-t="filtro_auditorios">Auditórios</button>
      <button type="button" class="chip" data-tipo="sala" aria-pressed="false" data-t="filtro_salas">Salas</button>
      <button type="button" class="chip" data-tipo="laboratorio" aria-pressed="false" data-t="filtro_laboratorio">Lab</button>
    </fieldset>

    <!-- Sessões do dia, agrupadas por horário. Enquanto carrega, blocos cinza. -->
    <div id="blocos" class="blocos" aria-busy="true">
      <div class="esqueleto" aria-hidden="true"></div>
      <div class="esqueleto" aria-hidden="true"></div>
      <div class="esqueleto" aria-hidden="true"></div>
    </div>

    <footer class="rodape">
      <p data-t="rodape_contagem">A contagem é feita por voluntários na porta de cada sala.</p>
    </footer>
  </main>

  <script src="static/idioma.js?v=4"></script> <!-- primeiro: os outros usam a função t() -->
  <script src="static/comum.js?v=4"></script>
  <script src="static/programacao.js?v=4"></script>
</body>
</html>
