<!doctype html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="utf-8">
  <base href="/live/"> <!-- o site fica em /live: endereços sem "/" no começo são relativos a ele -->
  <link rel="icon" href="static/favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="apple-touch-icon" href="static/apple-touch-icon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lotação — BRACIS 2026</title>
  <link rel="stylesheet" href="static/pico.min.css"> <!-- Pico CSS 2.1.1, guardado aqui (não depende de CDN) -->
  <link rel="stylesheet" href="static/estilo.css?v=2">
</head>
<body>
  <header class="topo">
    <div class="container">
      <img src="static/logo-bracis.png" alt="BRACIS 2026" width="1200" height="500">
      <span class="topo-rotulo">Lotação</span>
    </div>
  </header>

  <main class="container">
    <!-- Mensagens de erro ou confirmação aparecem aqui -->
    <p id="mensagem" role="status"></p>

    <!-- Tela 1: login -->
    <section id="tela-login" hidden>
      <h1>Entrar</h1>
      <form id="form-login">
        <label>
          Usuário
          <!-- autocapitalize/autocorrect: o celular não troca "contagem" por "Contagem" -->
          <input name="usuario" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required>
        </label>
        <label>
          Senha
          <input type="password" name="pin" inputmode="numeric" autocomplete="current-password" required>
        </label>
        <button type="submit">Entrar</button>
      </form>
    </section>

    <!-- Tela 2: escolher de qual sala o voluntário vai informar a lotação -->
    <section id="tela-ambientes" hidden>
      <p>Olá, <strong class="nome-voluntario"></strong>! De qual sala você vai informar a lotação?</p>
      <div id="lista-ambientes"></div>
      <button class="secondary outline largura-total" data-acao="sair">Trocar voluntário</button>
    </section>

    <!-- Tela 3: estimativa. O voluntário olha a sala e toca na % que acha que está ocupada. -->
    <section id="tela-estimativa" hidden>
      <h2 id="nome-ambiente" class="centro"></h2>
      <p id="sessao-agora" class="centro"></p>
      <p class="estimativa-atual centro">
        <span id="estimativa">—</span>
        <small id="estimativa-quando">Ainda sem estimativa nesta sessão</small>
      </p>

      <p class="centro"><small>Quanto da sala está ocupado agora?</small></p>
      <!-- Os botões de 0% a 100% e o "gente em pé" são criados pelo voluntario.js -->
      <div id="botoes-porcentagem" class="botoes-porcentagem"></div>

      <footer class="centro">
        <p>Informando: <strong class="nome-voluntario"></strong></p>
        <!-- Botões (e não links) para ficarem fáceis de tocar: pelo menos 44 px -->
        <div class="botoes-rodape">
          <button class="secondary outline" data-acao="trocar-sala">Trocar sala</button>
          <button class="secondary outline" data-acao="sair">Trocar voluntário</button>
        </div>
      </footer>
    </section>
  </main>

  <script src="static/voluntario.js?v=3"></script>
</body>
</html>
