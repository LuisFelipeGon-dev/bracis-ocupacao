<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <base href="/live/"> <!-- o site fica em /live: endereços sem "/" no começo são relativos a ele -->
  <link rel="icon" href="static/favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="apple-touch-icon" href="static/apple-touch-icon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#F5F3EE">
  <title data-t="titulo_sala">Sala — BRACIS 2026</title>
  <!-- ?v=4: muda a cada atualização, para o celular não misturar arquivo novo com antigo guardado -->
  <link rel="preload" href="static/fontes/bricolage-grotesque.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="static/tokens.css?v=4">
  <link rel="stylesheet" href="static/publico.css?v=4">
</head>
<body class="pagina-sala">
  <header class="topo">
    <div class="largura">
      <a href="./" class="topo-logo"><img src="static/logo-bracis.webp" alt="BRACIS 2026" width="419" height="213"></a>
      <div class="topo-direita">
        <span id="selo-ao-vivo" class="selo-ao-vivo">
          <span class="ponto" aria-hidden="true"></span>
          <span><span class="selo-rotulo"><span data-t="ao_vivo">AO VIVO</span> · </span><span id="selo-hora">--:--</span></span>
        </span>
        <span id="aviso-conexao" class="so-leitor" role="status"></span>
        <a id="botao-idioma" class="botao-idioma" href="?lang=en" lang="en">EN</a>
      </div>
    </div>
  </header>

  <main class="largura">
    <a href="./" class="voltar">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
      <span data-t="todas_as_salas">Todas as salas</span>
    </a>

    <!-- Aparece só se o código da sala no endereço não existir -->
    <article id="nao-encontrada" class="cartao-branco" hidden>
      <h1 class="sala-nome" data-t="sala_nao_encontrada">Sala não encontrada</h1>
      <p class="frase"><span data-t="confira_endereco">Confira o endereço ou</span>
        <a href="./" data-t="volte_para_lista">volte para a lista de salas</a>.</p>
    </article>

    <!-- Blocos cinza enquanto os dados chegam -->
    <div id="esqueleto-sala" class="esqueleto-sala" aria-hidden="true">
      <div class="esqueleto"></div>
      <div class="esqueleto"></div>
      <div class="esqueleto"></div>
    </div>

    <div id="conteudo" hidden>
      <div class="sala-cabecalho">
        <span id="tipo" class="rotulo-mono"></span>
        <h1 id="nome" class="sala-nome"></h1>
      </div>

      <!-- Lotação agora -->
      <section class="cartao-branco lotacao">
        <div class="lotacao-topo">
          <p class="lotacao-numero">
            <span id="ocupacao" class="numero-display"></span>
            <span id="capacidade" class="lugares"></span>
          </p>
          <span id="nivel"></span>
        </div>
        <div id="barra-lotacao"></div>
        <p id="frase-lotacao" class="frase"></p>
        <p id="entradas-saidas" class="apoio-pequeno"></p>
      </section>

      <!-- Sessão acontecendo agora (ou a próxima) -->
      <section class="secao">
        <div class="secao-titulo"><h2 data-t="agora">Agora</h2></div>
        <div id="bloco-agora"></div>
      </section>

      <!-- Gráfico de barras: pico de pessoas em cada hora de hoje -->
      <section class="secao">
        <div class="secao-titulo">
          <h2 data-t="movimento_hoje">Movimento de hoje</h2>
          <span class="dica" data-t="pico_por_hora">pico por hora</span>
        </div>
        <div class="cartao-branco">
          <div id="grafico"></div>
          <details>
            <summary data-t="ver_em_tabela">Ver em tabela</summary>
            <table class="tabela">
              <thead><tr><th data-t="hora">Hora</th><th data-t="pico">Pico</th></tr></thead>
              <tbody id="tabela-movimento"></tbody>
            </table>
          </details>
        </div>
      </section>

      <!-- Próximas sessões e programação completa da sala -->
      <section class="secao">
        <div class="secao-titulo"><h2 data-t="a_seguir">A seguir nesta sala</h2></div>
        <div id="a-seguir"></div>
        <details>
          <summary data-t="ver_programacao_completa">Ver programação completa da sala</summary>
          <div id="programacao"></div>
        </details>
      </section>
    </div>

    <footer class="rodape">
      <p data-t="rodape_contagem">A contagem é feita por voluntários na porta de cada sala.</p>
    </footer>
  </main>

  <script src="static/idioma.js?v=4"></script> <!-- primeiro: os outros usam a função t() -->
  <script src="static/comum.js?v=4"></script>
  <script src="static/sala.js?v=4"></script>
</body>
</html>
